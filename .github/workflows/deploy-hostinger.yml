name: Deploy para Hostinger (Produção)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pegar o código fonte
        uses: actions/checkout@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Instalar dependências e Gerar Site
        run: |
          npm ci
          npm run build

      - name: Publicar arquivos na branch deploy
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

          # Salva os arquivos gerados fora do repo
          cp -r _site /tmp/site-build

          # Faz checkout da branch deploy (ou cria como orphan se não existir)
          git fetch origin deploy 2>/dev/null || true
          git checkout deploy 2>/dev/null || git checkout --orphan deploy

          # Remove tudo e copia os arquivos novos
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/site-build/. .

          # Commit e push normal, sem --force
          git add -A
          git commit -m "deploy: ${{ github.sha }}" || echo "Nada para commitar"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git deploy

      - name: Avisar o flori-bot para sincronizar o corpus
        if: success()
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/fb_resp.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FLORIBOT_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/floriano-des/flori-bot/dispatches \
            -d '{"event_type":"portfolio-updated"}')
          echo "HTTP $code"
          cat /tmp/fb_resp.txt || true
          if [ "$code" = "204" ]; then echo "flori-bot avisado."; else echo "Aviso ao flori-bot falhou (o cron de 6h cobre)."; fi
