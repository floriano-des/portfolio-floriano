name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=portfolio-floriano --branch=main

      - name: Avisar o flori-bot para sincronizar o corpus
        if: success()
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/fb_resp.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FLORIBOT_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/floriano-des/flori-bot/dispatches \
            -d '{"event_type":"portfolio-updated"}')
          echo "HTTP $code"
          cat /tmp/fb_resp.txt || true
          if [ "$code" = "204" ]; then echo "flori-bot avisado."; else echo "Aviso ao flori-bot falhou (o cron de 6h cobre)."; fi
